<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie</title>
</head>
<body>
    <h1>Edit Movie</h1>
    <form method="POST">
        <label for="title">Movie Title:</label>
        <input type="text" id="title" name="title" value="{{ movie.title }}" required><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required>{{ movie.description }}</textarea><br>

        <label for="poster_url">Poster URL:</label>
        <input type="text" id="poster_url" name="poster_url" value="{{ movie.poster_url }}"><br>

        <label for="rating">Rating:</label>
        <input type="text" id="rating" name="rating" value="{{ movie.rating }}"><br>

        <button type="submit">Update Movie</button>
    </form>
    <br>
    <a href="{{ url_for('main.movie_list') }}">Back to Movies List</a>
</body>
</html>
