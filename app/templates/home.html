<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">🎬 My Movies</h1>
        <div class="text-center mb-4">
            <a href="{{ url_for('main.add_movie') }}" class="btn btn-success">➕ Add a new movie</a>
        </div>

        {% if movies %}
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                {% for movie in movies %}
                    <div class="col">
                        <div class="card h-100 bg-secondary text-light">
                            {% if movie.poster_url %}
                                <img src="{{ movie.poster_url }}" class="card-img-top" alt="{{ movie.title }}">
                            {% endif %}
                            <div class="card-body">
                                <h5 class="card-title">{{ movie.title }} ({{ movie.year }})</h5>
                                <p class="card-text">{{ movie.description[:100] }}...</p>
                                <a href="{{ url_for('main.movie_detail', movie_id=movie.id) }}" class="btn btn-info">More Info</a>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-center mt-5">No movies added yet... Add your first movie! 🎥</p>
        {% endif %}
    </div>

</body>
</html>
