<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add a Movie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">➕ Add a New Movie</h1>

        <form method="POST" class="w-50 mx-auto">
            <div class="mb-3">
                <label for="title" class="form-label">Movie Name</label>
                <input type="text" class="form-control" id="title" name="title" placeholder="e.g., Fight Club" required>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-warning">
                    <ul>
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
            {% endwith %}

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Search and Add Movie</button>
                <a href="{{ url_for('main.index') }}" class="btn btn-secondary ms-2">Back to Home</a>
            </div>
        </form>
    </div>

</body>
</html>
